name: shop_admin
description: "Local-only e-commerce app with an admin dashboard (Clean Architecture, drift, BLoC)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (Section B.3): Cubit per feature, sealed states + Equatable.
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

  # Declarative routing: StatefulShellRoute for shop/admin shells + redirect guard.
  go_router: ^17.4.0

  # Manual service locator, no codegen.
  get_it: ^9.2.1

  # Value equality for immutable state classes and entities.
  equatable: ^2.1.0

  # Local database: type-safe relational SQLite with reactive streams + migrations.
  # Why drift: relational data (products/orders/cart) with cross-entity invariants;
  # sqflite is untyped and has no streams, Isar/Hive are not relational.
  drift: ^2.34.3

  # Official drift setup for Flutter: handles native sqlite3 init on Android/Windows.
  drift_flutter: ^0.3.1

  # SHA-256 for the admin PIN gate (Decision B, Option 2: salted hash, never
  # the raw PIN). Section D.3 — why now: the gate needs a one-way hash and
  # dart:core has none. Why this: `crypto` is the minimal standard (SHA-256);
  # alternatives rejected — pointycastle/PBKDF2 (real-auth-grade KDF for a
  # mock gate), flutter_secure_storage (stores the PIN recoverably, contrary
  # to the hash-not-store decision), hand-rolled (never for security code).
  # Salt entropy comes from dart:math Random.secure(), so no further deps.
  crypto: ^3.0.6

  # Admin product images (Task 14): pick from the gallery. Section D.3 —
  # image_picker is the standard platform-channel wrapper (Android/Windows
  # supported); the alternative is hand-rolling platform channels (no). The
  # picked file is COPIED into the app documents dir by ImageStore.
  image_picker: ^1.2.0

  # Resolves the app documents directory for stored product images
  # (path_provider). Required for local file storage — no alternative in the
  # Dart SDK.
  path_provider: ^2.1.5

  # Admin overview chart (Task 18). Section D.3 — why now: the dashboard's
  # orders-by-status bar chart; the SDK has no charting. Why this: fl_chart is
  # the de-facto standard, pure-Dart canvas drawing (no platform channels —
  # works on Android + Windows, our two targets), and battle-tested.
  # Alternatives rejected: hand-rolled CustomPaint (re-inventing a chart
  # library for one bar chart), syncfusion_flutter_charts (commercial-grade
  # licensing for a demo dashboard). Deferral considered: the chart is
  # replaceable later without touching the data layer (the cubit exposes
  # plain counts).
  fl_chart: ^1.2.0
  # AR/EN localization (Task 23). flutter_localizations provides the
  # Global Material/Widgets/Cupertino delegates; intl powers the generated
  # AppLocalizations (ARB) plus locale-aware money/date formatting. Version
  # pinned by flutter_localizations (0.20.2) — never bump independently.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # Admin order CSV export (roadmap): native Save-As dialog via the
  # Flutter-endorsed file_selector (first-party, Windows/Android supported —
  # matches image_picker's platform-channel pattern already in use). The CSV
  # bytes themselves are produced by a pure serializer (core/utils/order_csv)
  # and only the dialog+write touch the platform, so the export logic stays
  # fully unit-testable. Alternatives rejected: file_picker (community, both
  # pick+save — we only need save), hand-rolled platform channels (no).
  file_selector: ^1.1.0

  # Customer PDF receipt export (roadmap): pure-Dart PDF generation — no
  # platform channels, works identically on Windows + Android (our two
  # targets). The SDK has no PDF support; alternatives rejected: printing
  # (adds print/share dialogs on top of pdf — heavier than a save-to-file
  # export), hand-rolled PDF writer (never). Arabic renders via the bundled
  # OFL font (assets/fonts/Amiri-Regular.ttf) — pdf's built-in fonts are
  # Latin-only, so ar receipts need an embedded TrueType font. The bytes are
  # produced by a pure serializer (core/utils/order_receipt_pdf) and only the
  # Save-As dialog + write touch the platform (same split as the CSV export).
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Raw SQLite access in tests: device-DB inspection (test/tool) and the
  # genuine-v1-schema migration drill in app_database_test create/read
  # databases directly. Already pinned transitively by drift — promoted here
  # so importing it doesn't trip depend_on_referenced_packages.
  sqlite3: ^3.5.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Cubit/state testing (Section E).
  bloc_test: ^10.0.0

  # Mocking without codegen.
  mocktail: ^1.0.5

  # Code generation for drift tables/DAOs (approved Phase 1 exception to the
  # no-codegen rule; generated .g.dart files are committed).
  # Relaxed to ^2.34.0: drift_dev >=2.34.1+1 pulls analyzer ^13.0.0, which
  # conflicts with the SDK's test_api pin via bloc_test (Section D.3 — the
  # solver picks the newest compatible 2.34.x). Keep drift_dev aligned with
  # the drift runtime on future upgrades (currently dev 2.34.0 vs 2.34.3;
  # compatible, verified by codegen + tests).
  drift_dev: ^2.34.0
  # Pinned below 2.15.2: build_runner >=2.15.2 requires meta ^1.18.3, which
  # conflicts with the Flutter SDK's flutter_test pin on meta 1.18.0. 2.15.1 is
  # the newest compatible version (Section D.3: deviation from "latest stable"
  # is justified by the SDK constraint; revisit on next Flutter upgrade).
  build_runner: 2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Task 23 (AR/EN localization): runs `flutter gen-l10n` on pub get/build,
  # generating AppLocalizations into lib/l10n/ (see l10n.yaml).
  generate: true

  # The bundled Arabic receipt font (OFL-1.1, Google Fonts): pdf's built-in
  # fonts are Latin-only, so Arabic order receipts embed this TrueType font.
  assets:
    - assets/fonts/Amiri-Regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
