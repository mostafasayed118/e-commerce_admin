name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze + audit + full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Fast pre-gate: the two contracts that regress silently (uncovered
      # lib/ sources, duplicated helpers) fail here in seconds instead of
      # after the ~1-minute full suite. Invoked via `bash` so the runner
      # never depends on the script's git file-mode bit (a Windows-authored
      # repo may not carry the +x bit, which would make the direct `./`
      # form fail with exit 126).
      - name: Fast gate — analyzer + coverage/consolidation audit
        run: bash ./tool/check.sh

      # The full gate: every test. The audit also runs inside this suite, so
      # a failure here catches anything the fast gate's narrower scope missed.
      - name: Full test suite
        run: flutter test
